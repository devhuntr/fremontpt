<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="16" fill="#9F0909"/>
  <!-- Mountain outline - top peak -->
  <polyline
    points="10,72 35,32 50,50 65,22 90,72"
    fill="none"
    stroke="white"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <!-- Second mountain line (shadow/depth) -->
  <polyline
    points="10,80 32,46 50,60 68,34 90,80"
    fill="none"
    stroke="rgba(255,255,255,0.4)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
